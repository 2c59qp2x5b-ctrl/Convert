<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to MP3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
            padding: 40px 24px;
            margin: auto;
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #111111;
            margin-bottom: 4px;
        }

        p.desc {
            font-size: 0.85rem;
            color: #666666;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            background: #ffffff;
            color: #111111;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: #111111;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #ffffff;
            color: #111111;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            width: 100%;
        }

        .btn:hover {
            border-color: #111111;
            background: #fafafa;
        }

        .btn-dark {
            background: #111111;
            color: #ffffff;
            border-color: #111111;
        }

        .btn-dark:hover {
            background: #333333;
            border-color: #333333;
        }

        .hidden {
            display: none !important;
        }

        footer {
            font-size: 0.75rem;
            color: #888888;
            padding: 24px;
            text-align: center;
            letter-spacing: 0.02em;
        }

        .actions-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .back-btn {
            width: auto;
            padding: 12px 16px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Step 1: URL Input -->
        <div id="stepOne" class="card">
            <div>
                <h1>YouTube Link</h1>
                <p class="desc">Paste the video link to begin processing</p>
            </div>
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
            </div>
            <button class="btn btn-dark" onclick="validateAndProceed()">Continue</button>
        </div>

        <!-- Step 2: Metadata & Download -->
        <div id="stepTwo" class="card hidden">
            <div>
                <h1>Track Details</h1>
                <p class="desc">Configure metadata before downloading</p>
            </div>

            <div class="input-group">
                <label for="artistInput">Artist</label>
                <input type="text" id="artistInput" placeholder="Enter artist name">
            </div>

            <div class="input-group">
                <label for="fileNameInput">File Name</label>
                <input type="text" id="fileNameInput" placeholder="Enter file name">
            </div>

            <div class="actions-row" style="margin-top: 10px;">
                <button class="btn back-btn" onclick="goBackToStepOne()">Back</button>
                <button class="btn btn-dark" style="flex: 1;" onclick="downloadFile()">Download</button>
            </div>
        </div>
    </div>

    <footer>
        Minimalist Audio Converter
    </footer>

    <script>
        let savedUrl = '';

        function validateAndProceed() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                alert('Please enter a valid YouTube URL');
                return;
            }
            savedUrl = url;
            document.getElementById('stepOne').classList.add('hidden');
            document.getElementById('stepTwo').classList.remove('hidden');
        }

        function goBackToStepOne() {
            document.getElementById('stepTwo').classList.add('hidden');
            document.getElementById('stepOne').classList.remove('hidden');
        }

        function downloadFile() {
            if (!savedUrl) {
                alert('Please enter a valid YouTube URL');
                goBackToTestOne();
                return;
            }

            const artist = document.getElementById('artistInput').value.trim();
            const fileName = document.getElementById('fileNameInput').value.trim();

            // Redirection vers un service de conversion alternatif stable
            const targetUrl = `https://www.y2mate.com/search/${encodeURIComponent(savedUrl)}`;
            window.open(targetUrl, '_blank');
        }
    </script>
</body>
</html>
